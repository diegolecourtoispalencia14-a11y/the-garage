    <rect x="200" y="110" width="25" height="16" rx="2"/>
    <rect x="240" y="110" width="25" height="25" rx="2"/>

    <rect x="35" y="145" width="20" height="35" rx="2"/>
    <rect x="70" y="155" width="25" height="16" rx="2"/>
    <rect x="110" y="145" width="35" height="16" rx="2"/>
    <rect x="160" y="135" width="25" height="35" rx="2"/>
