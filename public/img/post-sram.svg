<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="redSram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3838"/>
      <stop offset="100%" stop-color="#D60000"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#sramBg)"/>

  <!-- Top Badge -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#27272A" stroke="#3F3F46"/>
    <text x="90" y="19" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5">🔧 TALLER &amp; SERVICE</text>
  </g>

  <!-- Big Brand Heading -->
  <text x="50%" y="190" text-anchor="middle" fill="url(#redSram)" font-family="-apple-system, sans-serif" font-weight="900" font-size="48" letter-spacing="4">SRAM AXS</text>
  <text x="50%" y="230" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="3">EAGLE TRANSMISSION</text>
  <text x="50%" y="260" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="2">INSTALACIÓN &amp; CALIBRACIÓN ELECTRÓNICA</text>

  <!-- Mechanical Cassette & Derailleur Diagram Graphic -->
  <g transform="translate(300, 390)">
    <!-- Cassette Cogs -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#27272A" stroke-width="8" stroke-dasharray="10 6"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#3F3F46" stroke-width="8" stroke-dasharray="8 5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#52525B" stroke-width="8" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#D4D4D8" stroke-width="8" stroke-dasharray="4 3"/>
    <circle cx="0" cy="0" r="14" fill="#FF3838"/>
    <!-- Wireless Signal Waves -->
    <path d="M 50 -60 A 80 80 0 0 1 120 10" fill="none" stroke="#FF3838" stroke-width="4" stroke-linecap="round"/>
    <path d="M 70 -80 A 110 110 0 0 1 150 10" fill="none" stroke="#FF3838" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Bottom Tag -->
  <rect x="40" y="520" width="520" height="40" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <text x="50%" y="546" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1">MECÁNICOS CERTIFICADOS • PLAYA DEL CARMEN</text>
</svg>
