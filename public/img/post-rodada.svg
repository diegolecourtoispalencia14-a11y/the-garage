<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="caribeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#caribeBg)"/>

  <!-- Top Badge -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="190" height="28" rx="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)"/>
    <text x="95" y="19" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5">🌴 RODADAS DEL CARIBE</text>
  </g>

  <!-- Big Heading -->
  <text x="50%" y="200" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="42" letter-spacing="2">RODADA SABATINA</text>
  <text x="50%" y="240" text-anchor="middle" fill="#5EEAD4" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="3">PLAYA • CENOTES • PUERTO AVENTURAS</text>
  <text x="50%" y="270" text-anchor="middle" fill="#CCFBF1" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="2">55 KM DE CONVIVENCIA CICLISTA</text>

  <!-- Tropical & Coastal Trail Silhouette Graphic -->
  <g transform="translate(100, 310) scale(0.65)" stroke="#5EEAD4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="240" r="90" stroke="#134E4A" stroke-width="14"/>
    <circle cx="100" cy="240" r="90" stroke="#5EEAD4" stroke-width="4"/>
    <circle cx="480" cy="240" r="90" stroke="#134E4A" stroke-width="14"/>
    <circle cx="480" cy="240" r="90" stroke="#5EEAD4" stroke-width="4"/>
    <path d="M 100 240 L 260 240 L 220 120 L 100 240 Z" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M 260 240 L 410 110 L 220 120" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M 480 240 L 410 110 L 390 80 L 420 80" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M 220 120 L 205 70 M 180 70 L 230 70" stroke="#FFFFFF" stroke-width="8"/>
  </g>

  <!-- Bottom Tag -->
  <rect x="40" y="520" width="520" height="40" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="50%" y="546" text-anchor="middle" fill="#F0FDFA" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1">TODOS LOS NIVELES • SALIDA DESDE THE GARAGE</text>
</svg>
