<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="800" fill="#F8FAFC"/>
  
  <!-- Subtle Grid Accent -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#grid)" opacity="0.6"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="400" cy="620" rx="300" ry="24" fill="#000000" opacity="0.08"/>

  <!-- Bike Silhouette Graphic (MTB Trek Marlin 5 Style) -->
  <g transform="translate(100, 180) scale(0.75)">
    <!-- Wheels -->
    <circle cx="150" cy="450" r="140" fill="none" stroke="#1E293B" stroke-width="22"/>
    <circle cx="150" cy="450" r="115" fill="none" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="650" cy="450" r="140" fill="none" stroke="#1E293B" stroke-width="22"/>
    <circle cx="650" cy="450" r="115" fill="none" stroke="#94A3B8" stroke-width="3"/>
    
    <!-- Wheel Hubs & Spokes -->
    <circle cx="150" cy="450" r="16" fill="#0F172A"/>
    <circle cx="650" cy="450" r="16" fill="#0F172A"/>
    <path d="M 150 310 L 150 590 M 10 450 L 290 450 M 50 350 L 250 550 M 50 550 L 250 350" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M 650 310 L 650 590 M 510 450 L 790 450 M 550 350 L 750 550 M 550 550 L 750 350" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Disc Brakes & Chainring -->
    <circle cx="150" cy="450" r="40" fill="none" stroke="#64748B" stroke-width="4" stroke-dasharray="6 3"/>
    <circle cx="650" cy="450" r="40" fill="none" stroke="#64748B" stroke-width="4" stroke-dasharray="6 3"/>
    <circle cx="360" cy="450" r="48" fill="#1E293B"/>
    <circle cx="360" cy="450" r="28" fill="#DC2626"/>

    <!-- Frame Geometry (MTB Hardtail) -->
    <!-- Rear stays -->
    <path d="M 150 450 L 360 450" stroke="#DC2626" stroke-width="14" stroke-linecap="round"/>
    <path d="M 150 450 L 330 260" stroke="#DC2626" stroke-width="14" stroke-linecap="round"/>
    <!-- Seat tube -->
    <path d="M 360 450 L 315 190" stroke="#0F172A" stroke-width="18" stroke-linecap="round"/>
    <!-- Down tube -->
    <path d="M 360 450 L 560 210" stroke="#0F172A" stroke-width="24" stroke-linecap="round"/>
    <!-- Top tube -->
    <path d="M 330 260 L 560 210" stroke="#DC2626" stroke-width="18" stroke-linecap="round"/>
    <!-- Head tube & Fork -->
    <path d="M 560 210 L 580 150" stroke="#0F172A" stroke-width="20" stroke-linecap="round"/>
    <path d="M 560 210 L 650 450" stroke="#0F172A" stroke-width="16" stroke-linecap="round"/>
    <!-- Suspension Fork Stanchions -->
    <path d="M 605 330 L 650 450" stroke="#64748B" stroke-width="14" stroke-linecap="round"/>

    <!-- Saddle & Post -->
    <path d="M 315 190 L 305 140" stroke="#334155" stroke-width="12"/>
    <path d="M 260 140 Q 320 130 350 145" stroke="#0F172A" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Handlebars & Stem -->
    <path d="M 580 150 L 560 135 L 540 135" stroke="#1E293B" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="535" cy="135" r="8" fill="#DC2626"/>

    <!-- Pedals -->
    <path d="M 360 450 L 340 500" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    <rect x="325" y="495" width="30" height="10" rx="3" fill="#0F172A"/>
  </g>

  <!-- Spec Watermark Badge -->
  <g transform="translate(40, 40)">
    <rect width="180" height="38" rx="8" fill="#DC2626"/>
    <text x="90" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TREK MARLIN 5</text>
  </g>

  <g transform="translate(620, 40)">
    <rect width="140" height="38" rx="8" fill="#1E293B"/>
    <text x="70" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#F8FAFC" text-anchor="middle">RODADA 29"</text>
  </g>

  <!-- Sample Watermark Banner -->
  <g transform="translate(240, 720)">
    <rect width="320" height="42" rx="21" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="160" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#64748B" text-anchor="middle">FOTO DE MUESTRA 1/2</text>
  </g>
</svg>
