<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <rect width="800" height="800" fill="#F8FAFC"/>
  <defs>
    <pattern id="gridRoad" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#gridRoad)" opacity="0.6"/>
  <ellipse cx="400" cy="620" rx="300" ry="24" fill="#000000" opacity="0.08"/>

  <!-- Bike Silhouette Graphic (Road Specialized Allez Style) -->
  <g transform="translate(100, 180) scale(0.75)">
    <!-- Thin Road Wheels 700c -->
    <circle cx="150" cy="450" r="140" fill="none" stroke="#0F172A" stroke-width="14"/>
    <circle cx="150" cy="450" r="128" fill="none" stroke="#64748B" stroke-width="2"/>
    <circle cx="650" cy="450" r="140" fill="none" stroke="#0F172A" stroke-width="14"/>
    <circle cx="650" cy="450" r="128" fill="none" stroke="#64748B" stroke-width="2"/>
    
    <circle cx="150" cy="450" r="14" fill="#0284C7"/>
    <circle cx="650" cy="450" r="14" fill="#0284C7"/>
    <path d="M 150 310 L 150 590 M 10 450 L 290 450 M 50 350 L 250 550 M 50 550 L 250 350" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M 650 310 L 650 590 M 510 450 L 790 450 M 550 350 L 750 550 M 550 550 L 750 350" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Chainring -->
    <circle cx="360" cy="450" r="45" fill="#1E293B"/>
    <circle cx="360" cy="450" r="30" fill="#0284C7"/>

    <!-- Frame Geometry (Road Aero) -->
    <path d="M 150 450 L 360 450" stroke="#0284C7" stroke-width="12" stroke-linecap="round"/>
    <path d="M 150 450 L 330 240" stroke="#0284C7" stroke-width="12" stroke-linecap="round"/>
    <path d="M 360 450 L 325 170" stroke="#0284C7" stroke-width="16" stroke-linecap="round"/>
    <path d="M 360 450 L 560 210" stroke="#0284C7" stroke-width="20" stroke-linecap="round"/>
    <path d="M 330 240 L 560 210" stroke="#0284C7" stroke-width="16" stroke-linecap="round"/>
    <!-- Head tube & Carbon Road Fork -->
    <path d="M 560 210 L 575 160" stroke="#0F172A" stroke-width="16" stroke-linecap="round"/>
    <path d="M 560 210 L 650 450" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>

    <!-- Saddle & Aero Post -->
    <path d="M 325 170 L 320 120" stroke="#334155" stroke-width="12"/>
    <path d="M 270 120 Q 330 110 360 125" stroke="#0F172A" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- Drop Handlebars -->
    <path d="M 575 160 L 595 150 Q 620 160 610 190 Q 590 210 580 200" stroke="#0F172A" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Spec Watermark Badge -->
  <g transform="translate(40, 40)">
    <rect width="210" height="38" rx="8" fill="#0284C7"/>
    <text x="105" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SPECIALIZED ALLEZ</text>
  </g>

  <g transform="translate(620, 40)">
    <rect width="140" height="38" rx="8" fill="#1E293B"/>
    <text x="70" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#F8FAFC" text-anchor="middle">RUTA • 54 CM</text>
  </g>

  <!-- Sample Watermark Banner -->
  <g transform="translate(240, 720)">
    <rect width="320" height="42" rx="21" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="160" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#64748B" text-anchor="middle">FOTO DE MUESTRA 1/2</text>
  </g>
</svg>
