<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bassoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bassoBg)"/>

  <!-- Italian Tricolore Accent Ribbon -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="8" height="24" fill="#009246" rx="2"/>
    <rect x="12" y="0" width="8" height="24" fill="#FFFFFF" rx="2"/>
    <rect x="24" y="0" width="8" height="24" fill="#CE2B37" rx="2"/>
    <text x="42" y="18" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="14" letter-spacing="2">DISTRIBUIDOR OFICIAL BASSO</text>
  </g>

  <!-- Big Brand Heading -->
  <text x="50%" y="210" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="6">BASSO</text>
  <text x="50%" y="250" text-anchor="middle" fill="url(#goldAccent)" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="4">PALTA • GRAVEL & ROAD</text>
  <text x="50%" y="280" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="2">100% HANDMADE IN ITALY</text>

  <!-- Stylized Carbon Frame Geometry Silhouette -->
  <g transform="translate(100, 310) scale(0.65)" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear Wheel -->
    <circle cx="100" cy="240" r="90" stroke="#334155" stroke-width="12"/>
    <circle cx="100" cy="240" r="90" stroke="#FF5722" stroke-width="4" stroke-dasharray="8 12"/>
    <!-- Front Wheel -->
    <circle cx="480" cy="240" r="90" stroke="#334155" stroke-width="12"/>
    <circle cx="480" cy="240" r="90" stroke="#FF5722" stroke-width="4" stroke-dasharray="8 12"/>
    <!-- Frame Triangle -->
    <path d="M 100 240 L 260 240 L 220 120 L 100 240 Z" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M 260 240 L 410 110 L 220 120" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Fork & Cockpit -->
    <path d="M 480 240 L 410 110 L 390 80 L 420 80" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Seatpost & Saddle -->
    <path d="M 220 120 L 205 70 M 180 70 L 230 70" stroke="#FFFFFF" stroke-width="8"/>
  </g>

  <!-- Bottom Tag -->
  <rect x="40" y="520" width="520" height="40" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <text x="50%" y="546" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1">DISPONIBLE EN THE GARAGE • PLAYA DEL CARMEN</text>
</svg>
