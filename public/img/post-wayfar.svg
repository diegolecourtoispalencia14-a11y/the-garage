<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wayfarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="orangeWayfar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#wayfarBg)"/>

  <!-- Top Badge -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#EA580C"/>
    <text x="90" y="19" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5">⚡ NUTRICIÓN &amp; PERFORMANCE</text>
  </g>

  <!-- Big Brand Heading -->
  <text x="50%" y="200" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="6">WAYFAR</text>
  <text x="50%" y="240" text-anchor="middle" fill="url(#orangeWayfar)" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="3">HIDRATACIÓN &amp; ENERGÍA PRO</text>
  <text x="50%" y="270" text-anchor="middle" fill="#FED7AA" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="2">ELECTROLITOS, GELES Y PROTEÍNA</text>

  <!-- Clean Energy Drink Bottle & Nutrition Iconography -->
  <g transform="translate(300, 390)">
    <rect x="-35" y="-90" width="70" height="150" rx="14" fill="#FFFFFF" stroke="#FB923C" stroke-width="4"/>
    <rect x="-20" y="-115" width="40" height="25" rx="4" fill="#EA580C"/>
    <path d="M -10 -40 L 10 -40 L -5 -10 L 10 -10 L -10 30" stroke="#EA580C" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Tag -->
  <rect x="40" y="520" width="520" height="40" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <text x="50%" y="546" text-anchor="middle" fill="#FFEDD5" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1">DISPONIBLE EN TIENDA FÍSICA • THE GARAGE</text>
</svg>
