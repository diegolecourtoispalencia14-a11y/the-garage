  <!-- Brand Typography -->
  <text x="130" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#18181B" letter-spacing="1">THE GARAGE</text>
  <text x="132" y="86" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#FF5722" letter-spacing="4">TIENDA DE BICICLETAS • PLAYA DEL CARMEN</text>
