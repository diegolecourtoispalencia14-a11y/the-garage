<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="leeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="redRace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#leeBg)"/>

  <!-- Top Badge -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="url(#redRace)"/>
    <text x="80" y="19" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5">⚡ MTB XC RACE</text>
  </g>

  <!-- Big Brand Heading -->
  <text x="50%" y="200" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="4">LEE COUGAN</text>
  <text x="50%" y="240" text-anchor="middle" fill="url(#redRace)" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="3">RAMPAGA &amp; INNOVA</text>
  <text x="50%" y="270" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="2">AIR BLADE SUSPENSION SYSTEM</text>

  <!-- MTB Frame Geometry Silhouette -->
  <g transform="translate(100, 310) scale(0.65)" stroke="#EF4444" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Knobby MTB Tires -->
    <circle cx="100" cy="240" r="95" stroke="#3F3F46" stroke-width="18"/>
    <circle cx="100" cy="240" r="95" stroke="#EF4444" stroke-width="3" stroke-dasharray="6 8"/>
    <circle cx="480" cy="240" r="95" stroke="#3F3F46" stroke-width="18"/>
    <circle cx="480" cy="240" r="95" stroke="#EF4444" stroke-width="3" stroke-dasharray="6 8"/>
    <!-- Full-Suspension Frame Geometry -->
    <path d="M 100 240 L 250 250 L 220 140 L 100 240 Z" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M 250 250 L 410 130 L 220 140" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Shock Linkage -->
    <path d="M 220 180 L 290 195" stroke="#EF4444" stroke-width="8"/>
    <!-- Suspension Fork & Flat Bars -->
    <path d="M 480 240 L 410 130 L 390 100 M 370 100 L 410 100" stroke="#EF4444" stroke-width="8"/>
    <!-- Dropper Post & Saddle -->
    <path d="M 220 140 L 210 90 M 180 90 L 235 90" stroke="#FFFFFF" stroke-width="8"/>
  </g>

  <!-- Bottom Tag -->
  <rect x="40" y="520" width="520" height="40" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <text x="50%" y="546" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1">DISTRIBUIDOR OFICIAL THE GARAGE PDC</text>
</svg>
